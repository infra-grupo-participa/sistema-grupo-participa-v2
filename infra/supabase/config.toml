# Configuração das Edge Functions do Supabase.
#
# verify_jwt = false desabilita a exigência do header Authorization (anon key
# do Supabase). É obrigatório para webhooks de terceiros como a Hotmart, que
# autenticam com seus próprios mecanismos (no nosso caso, X-Hotmart-Hottok).
#
# Sem isso o gateway (Kong) responde 401 UNAUTHORIZED_NO_AUTH_HEADER antes
# da função executar — foi o que aconteceu nas compras de 13/05/2026, quando
# os disparos da Hotmart pararam de cair no Slack.
#
# A autenticação real desses webhooks é feita dentro do código de cada função
# via comparação do header X-Hotmart-Hottok com o secret HOTMART_HOTTOK.

project_id = "mbvybujpkwuorhtdzcde"

[functions.hotmart-events-webhook]
verify_jwt = false

[functions.hotmart-webhook]
verify_jwt = false

[functions.hotmart-hm-webhook]
verify_jwt = false

# hotmart-sync: chamado pelo pg_cron via pg_net sem Authorization; autentica pelo header x-sync-chave (Vault).
# Sem isto, um deploy sem --no-verify-jwt religa o JWT e o espelho da Hotmart para em silêncio (pentest 29/09).
[functions.hotmart-sync]
verify_jwt = false

# respondi-sync: chamado pelo cron respondi-sync via ops.cron_post sem Authorization; autentica pelo header
# x-sync-chave (Vault respondi_sync_chave), fail-closed.
[functions.respondi-sync]
verify_jwt = false

# trafego-meta e trafego-clickup (migration 20261006i): chamadas pelo cron via ops.cron_post sem Authorization;
# autenticam pelo header x-sync-chave (Vault trafego_coleta_chave), fail-closed. Nascem sem cron (desligadas).
[functions.trafego-meta]
verify_jwt = false

[functions.trafego-clickup]
verify_jwt = false

# mkt-web-pagespeed (20261006h): o cron chama com o header x-sync-chave (Vault mkt_web_pagespeed_chave), conferido
# na própria Edge, fail-closed. Sem isto, um deploy sem --no-verify-jwt devolve 401 ao cron.
[functions.mkt-web-pagespeed]
verify_jwt = false

# crm-integracao-webhook (F5 do CRM, migration 20261006c — NÃO publicada): webhooks de ActiveCampaign/Unnichat/SendFlow.
# Autentica pelo header x-webhook-secret conferido no banco contra o Vault (crm_webhook_<fonte>), fail-closed.
[functions.crm-integracao-webhook]
verify_jwt = false

# crm-whatsapp-webhook e crm-whatsapp-enviar (F4 do CRM, migration 20261006051434; publicadas em 07/10/2026).
# webhook: a Infobip chama sem JWT; autentica por Basic (senha = Vault crm_whatsapp_webhook_chave) ou header x-crm-chave.
# enviar: o cron chama via ops.cron_post sem JWT; autentica pelo header x-crm-chave (Vault crm_whatsapp_envio_chave).
# Ambas fail-closed (sem segredo no Vault → 503).
[functions.crm-whatsapp-webhook]
verify_jwt = false

[functions.crm-whatsapp-enviar]
verify_jwt = false

# crm-evolution-webhook (migration 20261008152212): a Evolution API (WhatsApp por QR) chama sem Authorization; autentica
# pelo header x-crm-chave conferido com a chave da instância no banco (crm.evolution_chave_webhook), fail-closed.
[functions.crm-evolution-webhook]
verify_jwt = false

# crm-evolution-enviar: chamada por crm.evolution_disparar_envio() e pelo cron crm-evolution-enviar (ops.cron_post) sem
# Authorization; autentica pelo header x-crm-chave (Vault crm_whatsapp_envio_chave), fail-closed.
[functions.crm-evolution-enviar]
verify_jwt = false
